<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A312 前進加拿大 搶佔楓之谷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --maple-red:#c0392b;--maple-orange:#e67e22;--maple-yellow:#f1c40f;
  --maple-green:#27ae60;--maple-blue:#2980b9;--maple-purple:#8e44ad;
  --ui-bg:rgba(10,20,40,0.92);--ui-border:#f1c40f;
}
body{background:#0a0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif;overflow:hidden;}

/* ========= TITLE ========= */
#game-title{
  color:var(--maple-yellow);font-size:1.5rem;font-weight:900;
  text-shadow:0 0 20px var(--maple-orange),2px 2px 0 #7b0000;
  letter-spacing:3px;margin-bottom:6px;text-align:center;
  position:relative;display:flex;align-items:center;gap:12px;
}
#gear-btn{
  width:36px;height:36px;cursor:pointer;flex-shrink:0;
  transition:transform 0.4s;filter:drop-shadow(0 0 6px #f1c40f88);
}
#gear-btn:hover{transform:rotate(60deg);}

/* ========= CANVAS WRAP ========= */
#game-wrap{position:relative;width:900px;max-width:100vw;}
canvas{display:block;border:3px solid var(--maple-yellow);border-radius:8px;
  box-shadow:0 0 40px rgba(192,57,43,0.4);cursor:crosshair;width:900px;max-width:100vw;}

/* ========= HUD ========= */
#hud{display:flex;justify-content:space-between;align-items:center;
  background:var(--ui-bg);border:2px solid var(--ui-border);border-top:none;
  border-radius:0 0 8px 8px;padding:7px 16px;color:#fff;font-size:.85rem;gap:10px;flex-wrap:wrap;}
.hud-item{display:flex;align-items:center;gap:5px;}
.hud-label{color:var(--maple-yellow);font-weight:700;font-size:.75rem;}
.hud-val{font-size:1rem;font-weight:900;color:#fff;text-shadow:0 0 8px var(--maple-orange);}
#ammo-bar{display:flex;gap:3px;align-items:center;flex-wrap:wrap;max-width:160px;}
.ammo-dot{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6,var(--maple-orange));border:1.5px solid #fff8;transition:.2s;}
.ammo-dot.used{background:#333;border-color:#555;}
#power-bar-bg{width:100px;height:12px;background:#222;border:1.5px solid #666;border-radius:6px;overflow:hidden;}
#power-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#27ae60,#f1c40f,#c0392b);border-radius:6px;transition:width .05s;}

/* ========= OVERLAYS COMMON ========= */
.overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.82);display:none;z-index:100;
  align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:16px 0;
}
.overlay.active{display:flex;}
.panel{
  background:linear-gradient(160deg,#0d1f3c,#1a0808);
  border:3px solid var(--maple-yellow);border-radius:16px;
  padding:20px 22px;color:#fff;max-width:520px;width:95%;
  box-shadow:0 0 60px rgba(192,57,43,0.5);
  margin:auto;flex-shrink:0;
}
.panel h2{color:var(--maple-yellow);font-size:1.4rem;margin-bottom:12px;text-align:center;text-shadow:0 0 10px #e67e22;}
.panel-btn{
  padding:9px 26px;background:linear-gradient(135deg,var(--maple-orange),var(--maple-red));
  color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;
  font-family:inherit;cursor:pointer;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(192,57,43,0.4);transition:transform .1s;
}
.panel-btn:hover{transform:scale(1.05);}
.panel-btn.secondary{background:linear-gradient(135deg,#2c3e50,#34495e);}

/* ========= CHARACTER SELECT ========= */
#char-select-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;}
.char-card{
  border:2.5px solid #444;border-radius:10px;padding:6px 3px 5px;
  cursor:pointer;text-align:center;transition:all .2s;
  background:rgba(255,255,255,0.04);
}
.char-card:hover{border-color:var(--maple-yellow);background:rgba(255,215,0,0.08);}
.char-card.selected{border-color:var(--maple-yellow);background:rgba(255,215,0,0.15);
  box-shadow:0 0 12px rgba(255,215,0,0.4);}
.char-card canvas{display:block;margin:0 auto 3px;width:44px!important;height:52px!important;}
.char-card .char-name{font-size:.68rem;color:#ddd;font-weight:700;}
#player-name-input{
  width:100%;padding:8px 12px;background:rgba(255,255,255,0.08);
  border:2px solid #555;border-radius:8px;color:#fff;font-size:1rem;
  font-family:inherit;margin-bottom:12px;
}
#player-name-input:focus{outline:none;border-color:var(--maple-yellow);}

/* ========= SETTINGS PANEL ========= */
.setting-row{display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
.setting-row:last-child{border-bottom:none;}
.setting-row label{color:#ddd;font-size:.9rem;}
.setting-row input[type=range]{width:160px;accent-color:var(--maple-yellow);}
.setting-row input[type=text]{
  width:220px;padding:5px 10px;background:rgba(255,255,255,0.08);
  border:1.5px solid #555;border-radius:6px;color:#fff;font-size:.9rem;font-family:inherit;
}
.setting-row input[type=text]:focus{outline:none;border-color:var(--maple-yellow);}
.setting-val{color:var(--maple-yellow);font-weight:700;font-size:.85rem;min-width:38px;text-align:right;}

/* ========= HIT POPUP ========= */
#hit-popup{
  position:absolute;z-index:50;display:none;
  background:rgba(10,20,40,0.97);border:3px solid var(--maple-yellow);
  border-radius:14px;padding:14px 20px 12px;
  box-shadow:0 0 30px rgba(255,215,0,0.5);
  animation:popIn .3s ease-out;
  pointer-events:auto;
  min-width:170px;
}
@keyframes popIn{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
#hit-popup .hit-inner{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
#hit-popup .hit-score{font-size:1.8rem;font-weight:900;color:var(--maple-yellow);
  text-shadow:0 0 12px #e67e22;}
#hit-popup .hit-label{font-size:.78rem;color:#aaa;}
#hit-popup .hit-pts-label{font-size:.75rem;color:#f1c40f;}
#hit-popup-ok{
  display:block;width:100%;padding:7px 0;
  background:linear-gradient(135deg,var(--maple-orange),var(--maple-red));
  color:#fff;border:none;border-radius:8px;
  font-size:.9rem;font-weight:700;font-family:inherit;
  cursor:pointer;letter-spacing:1px;
  box-shadow:0 3px 10px rgba(192,57,43,0.4);transition:transform .1s;
}
#hit-popup-ok:hover{transform:scale(1.04);}

/* ========= END OVERLAY ========= */
#end-overlay .panel{text-align:center;}
#end-overlay p{margin:6px 0;font-size:1rem;}
#end-score{font-size:2rem;font-weight:900;color:var(--maple-yellow);text-shadow:0 0 10px #e67e22;}

/* ========= FLOAT ANIM ========= */
.score-popup{
  position:absolute;font-weight:900;font-size:1.4rem;pointer-events:none;
  text-shadow:2px 2px 0 #000,0 0 10px currentColor;
  animation:floatUp 1.1s ease-out forwards;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1.2);}60%{opacity:1;transform:translateY(-40px);}100%{opacity:0;transform:translateY(-70px);}}

#instructions{color:#889;font-size:.73rem;text-align:center;margin-top:4px;letter-spacing:.5px;}
</style>
</head>
<body>

<div id="game-title">
  <span id="title-text">A312 前進加拿大 搶佔楓之谷</span>
  <svg id="gear-btn" viewBox="0 0 24 24" onclick="openSettings()" title="設定">
    <path fill="#f1c40f" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.74-.07-1.08l2.32-1.81c.21-.16.27-.45.14-.69l-2.2-3.81c-.13-.24-.42-.32-.66-.24l-2.73 1.1c-.57-.44-1.17-.81-1.85-1.08L14 2.42c-.04-.26-.27-.42-.54-.42h-2.92c-.27 0-.5.16-.54.42l-.41 2.97c-.68.27-1.28.64-1.85 1.08L5 5.37c-.24-.08-.53 0-.66.24L2.14 9.42c-.13.24-.07.53.14.69l2.32 1.81C4.56 12.26 4.5 12.63 4.5 13s.06.74.1 1.08L2.28 15.89c-.21.16-.27.45-.14.69l2.2 3.81c.13.24.42.32.66.24l2.73-1.1c.57.44 1.17.81 1.85 1.08l.41 2.97c.04.26.27.42.54.42h2.92c.27 0 .5-.16.54-.42l.41-2.97c.68-.27 1.28-.64 1.85-1.08l2.73 1.1c.24.08.53 0 .66-.24l2.2-3.81c.13-.24.07-.53-.14-.69l-2.32-1.81z"/>
  </svg>
</div>

<div id="game-wrap">
  <canvas id="gameCanvas" width="900" height="500"></canvas>
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">玩家</span>
      <span class="hud-val" id="player-display">-</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">總分</span>
      <span class="hud-val" id="score-display">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">角度</span>
      <span class="hud-val" id="angle-display">45°</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">力道</span>
      <div id="power-bar-bg"><div id="power-bar-fill"></div></div>
      <span class="hud-val" id="power-display">50%</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">砲彈</span>
      <div id="ammo-bar"></div>
    </div>
    <div class="hud-item">
      <span class="hud-label">輪次</span>
      <span class="hud-val" id="round-display">1/3</span>
    </div>
  </div>
  <div id="hit-popup">
    <div class="hit-inner">
      <canvas id="hit-char-canvas" width="54" height="72"></canvas>
      <div>
        <div class="hit-pts-label">擊中得分！</div>
        <div class="hit-score" id="hit-score-val">+500</div>
      </div>
    </div>
    <button id="hit-popup-ok" onclick="closeHitPopup()">✔ 確定</button>
  </div>
</div>
<div id="instructions">🖱 移動滑鼠調整角度 ｜ 按住左鍵蓄力，放開發射 ｜ 擊中楓谷角色獲得分數！</div>

<!-- Character Select -->
<div class="overlay active" id="char-overlay">
  <div class="panel">
    <h2>🍁 選擇你的角色</h2>
    <input type="text" id="player-name-input" placeholder="輸入你的名字..." maxlength="12">
    <div id="char-select-grid"></div>
    <div style="text-align:center;margin-top:8px;">
      <button class="panel-btn" onclick="confirmChar()">⚔ 進入戰場！</button>
    </div>
  </div>
</div>

<!-- Settings Panel -->
<div class="overlay" id="settings-overlay">
  <div class="panel">
    <h2>⚙ 遊戲設定</h2>
    <div class="setting-row">
      <label>遊戲標題</label>
      <input type="text" id="set-title" value="A312 前進加拿大 搶佔楓之谷">
    </div>
    <div class="setting-row">
      <label>目標移動速度</label>
      <input type="range" id="set-speed" min="0.2" max="4.0" step="0.1" value="1.5" oninput="document.getElementById('set-speed-val').textContent=parseFloat(this.value).toFixed(1)">
      <span class="setting-val" id="set-speed-val">1.5</span>
    </div>
    <div class="setting-row">
      <label>砲彈數量</label>
      <input type="range" id="set-ammo" min="5" max="20" step="1" value="10" oninput="document.getElementById('set-ammo-val').textContent=this.value">
      <span class="setting-val" id="set-ammo-val">10</span>
    </div>
    <div class="setting-row">
      <label>總輪次</label>
      <input type="range" id="set-rounds" min="1" max="5" step="1" value="3" oninput="document.getElementById('set-rounds-val').textContent=this.value">
      <span class="setting-val" id="set-rounds-val">3</span>
    </div>
    <div style="display:flex;justify-content:center;gap:12px;margin-top:18px;">
      <button class="panel-btn" onclick="applySettings()">✔ 套用</button>
      <button class="panel-btn secondary" onclick="closeSettings()">✕ 關閉</button>
    </div>
  </div>
</div>

<!-- End Game -->
<div class="overlay" id="end-overlay">
  <div class="panel">
    <h2>⚔ 戰鬥結束！</h2>
    <p>你成功搶佔了楓之谷！</p>
    <div id="end-score">0</div>
    <p style="color:#aaa;margin-bottom:16px;">最終得分</p>
    <button class="panel-btn" onclick="restartGame()">🍁 再戰一局</button>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const cfg = {
  title: 'A312 前進加拿大 搶佔楓之谷',
  speedMult: 1.5,
  ammoPerRound: 10,
  totalRounds: 3,
};

// ===================== CHARACTERS =====================
// 8 MapleStory-style pixel sprite definitions
// Each drawn via canvas 2D primitives to look like a chibi RPG character
const CHAR_DEFS = [
  { name:'戰士', skinColor:'#f5c8a0', hairColor:'#8B0000', clothColor:'#c0392b', armorColor:'#7f8c8d', weapon:'sword', hairStyle:'spiky' },
  { name:'弓箭手', skinColor:'#f5d5b0', hairColor:'#3d6b3d', clothColor:'#27ae60', armorColor:'#5d4037', weapon:'bow', hairStyle:'long' },
  { name:'魔法師', skinColor:'#f5c8c8', hairColor:'#6c3483', clothColor:'#8e44ad', armorColor:'#1a1a2e', weapon:'staff', hairStyle:'wavy' },
  { name:'盜賊', skinColor:'#d4a076', hairColor:'#1c1c1c', clothColor:'#2c3e50', armorColor:'#34495e', weapon:'dagger', hairStyle:'short' },
  { name:'祭司', skinColor:'#fff0d6', hairColor:'#f39c12', clothColor:'#f1c40f', armorColor:'#e67e22', weapon:'staff', hairStyle:'curly' },
  { name:'忍者', skinColor:'#c8b89a', hairColor:'#2c2c2c', clothColor:'#1a1a2e', armorColor:'#e74c3c', weapon:'shuriken', hairStyle:'bun' },
  { name:'海盜', skinColor:'#e8c49c', hairColor:'#8b4513', clothColor:'#e74c3c', armorColor:'#2c3e50', weapon:'gun', hairStyle:'messy' },
  { name:'召喚師', skinColor:'#d8c4e8', hairColor:'#5b2c6f', clothColor:'#9b59b6', armorColor:'#2980b9', weapon:'orb', hairStyle:'long' },
];

let selectedChar = 0;
let playerName = '';
let myCharDef = null;

// ===================== DRAW CHARACTER SPRITE =====================
function drawCharSprite(ctx2, def, x, y, scale=1, flipX=false) {
  ctx2.save();
  ctx2.translate(x, y);
  if(flipX) { ctx2.scale(-scale, scale); } else { ctx2.scale(scale, scale); }
  // Shadow
  ctx2.fillStyle='rgba(0,0,0,0.18)';
  ctx2.beginPath();ctx2.ellipse(0,30,10,3,0,0,Math.PI*2);ctx2.fill();
  // Legs
  ctx2.fillStyle=def.clothColor;
  ctx2.fillRect(-7,16,5,14);ctx2.fillRect(2,16,5,14);
  // Boots
  ctx2.fillStyle='#4a3728';
  ctx2.fillRect(-8,26,6,5);ctx2.fillRect(2,26,6,5);
  // Body
  ctx2.fillStyle=def.clothColor;
  ctx2.fillRect(-9,2,18,16);
  // Armor overlay
  ctx2.fillStyle=def.armorColor;
  ctx2.fillRect(-8,3,16,10);
  ctx2.fillStyle=def.armorColor+'aa';
  ctx2.fillRect(-8,2,3,16);ctx2.fillRect(5,2,3,16);
  // Arms
  ctx2.fillStyle=def.skinColor;
  ctx2.fillRect(-14,3,6,10);ctx2.fillRect(8,3,6,10);
  // Hands/gloves
  ctx2.fillStyle=def.armorColor;
  ctx2.fillRect(-15,10,6,5);ctx2.fillRect(9,10,6,5);
  // Head
  ctx2.fillStyle=def.skinColor;
  ctx2.beginPath();ctx2.ellipse(0,-8,9,9,0,0,Math.PI*2);ctx2.fill();
  // Eyes
  ctx2.fillStyle='#2c2c2c';
  ctx2.fillRect(-4,-9,3,3);ctx2.fillRect(2,-9,3,3);
  // Pupils shine
  ctx2.fillStyle='#fff';
  ctx2.fillRect(-3,-9,1,1);ctx2.fillRect(3,-9,1,1);
  // Mouth smile
  ctx2.strokeStyle='#a05030';ctx2.lineWidth=0.8;
  ctx2.beginPath();ctx2.arc(0,-5,3,0.1,Math.PI-0.1);ctx2.stroke();
  // Hair
  ctx2.fillStyle=def.hairColor;
  drawHair(ctx2, def.hairStyle, def.hairColor);
  // Weapon
  drawWeapon(ctx2, def.weapon, def.armorColor);
  ctx2.restore();
}

function drawHair(ctx2, style, color) {
  ctx2.fillStyle=color;
  if(style==='spiky'){
    [-6,-3,0,3,6].forEach((x,i)=>{ctx2.beginPath();ctx2.moveTo(x,-16);ctx2.lineTo(x-3,-22+i%2*4);ctx2.lineTo(x+3,-22+i%2*4);ctx2.closePath();ctx2.fill();});
    ctx2.fillRect(-9,-17,18,8);
  } else if(style==='long'){
    ctx2.fillRect(-9,-17,18,6);
    ctx2.fillRect(-9,-11,4,20);ctx2.fillRect(5,-11,4,18);
    ctx2.beginPath();ctx2.arc(0,-14,9,Math.PI,0);ctx2.fill();
  } else if(style==='wavy'){
    ctx2.fillRect(-9,-17,18,6);
    ctx2.beginPath();ctx2.arc(0,-14,9,Math.PI,0);ctx2.fill();
    for(let i=0;i<4;i++){ctx2.beginPath();ctx2.arc(-9+i*4,-8,2.5,0,Math.PI*2);ctx2.fill();}
  } else if(style==='short'){
    ctx2.fillRect(-8,-18,16,8);
    ctx2.beginPath();ctx2.arc(0,-14,8,Math.PI,0);ctx2.fill();
  } else if(style==='curly'){
    ctx2.beginPath();ctx2.arc(0,-14,9,Math.PI,0);ctx2.fill();
    for(let i=0;i<6;i++){const a=Math.PI+(i/5)*Math.PI;ctx2.beginPath();ctx2.arc(Math.cos(a)*9,-14+Math.sin(a)*9,3,0,Math.PI*2);ctx2.fill();}
  } else if(style==='bun'){
    ctx2.fillRect(-8,-17,16,6);
    ctx2.beginPath();ctx2.arc(0,-14,8,Math.PI,0);ctx2.fill();
    ctx2.beginPath();ctx2.arc(0,-20,4,0,Math.PI*2);ctx2.fill();
  } else if(style==='messy'){
    ctx2.beginPath();ctx2.arc(0,-14,9,Math.PI,0);ctx2.fill();
    [-8,-5,0,5,9].forEach(x=>{ctx2.beginPath();ctx2.moveTo(x,-17);ctx2.lineTo(x-2,-23);ctx2.lineTo(x+2,-23);ctx2.fill();});
  } else {
    ctx2.beginPath();ctx2.arc(0,-14,9,Math.PI,0);ctx2.fill();
    ctx2.fillRect(-9,-14,4,16);
  }
}

function drawWeapon(ctx2, type, color) {
  ctx2.fillStyle=color;ctx2.strokeStyle='#bbb';ctx2.lineWidth=1;
  if(type==='sword'){
    ctx2.strokeStyle='#ccc';ctx2.lineWidth=2.5;
    ctx2.beginPath();ctx2.moveTo(12,12);ctx2.lineTo(22,-10);ctx2.stroke();
    ctx2.strokeStyle='#e67e22';ctx2.lineWidth=2;
    ctx2.beginPath();ctx2.moveTo(10,13);ctx2.lineTo(15,13);ctx2.stroke();
  } else if(type==='bow'){
    ctx2.strokeStyle='#8b4513';ctx2.lineWidth=2;
    ctx2.beginPath();ctx2.arc(20,3,12,0.8,2.3);ctx2.stroke();
    ctx2.strokeStyle='#ddd';ctx2.lineWidth=1;
    ctx2.beginPath();ctx2.moveTo(18,-7);ctx2.lineTo(18,14);ctx2.stroke();
  } else if(type==='staff'){
    ctx2.strokeStyle='#8b4513';ctx2.lineWidth=2.5;
    ctx2.beginPath();ctx2.moveTo(12,15);ctx2.lineTo(22,-8);ctx2.stroke();
    ctx2.fillStyle='#9b59b6';
    ctx2.beginPath();ctx2.arc(22,-9,4,0,Math.PI*2);ctx2.fill();
  } else if(type==='dagger'){
    ctx2.strokeStyle='#aaa';ctx2.lineWidth=2;
    ctx2.beginPath();ctx2.moveTo(11,11);ctx2.lineTo(18,-1);ctx2.stroke();
  } else if(type==='shuriken'){
    ctx2.fillStyle='#7f8c8d';
    for(let i=0;i<4;i++){ctx2.save();ctx2.translate(22,5);ctx2.rotate(i*Math.PI/2);ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(3,-6);ctx2.lineTo(-3,-6);ctx2.closePath();ctx2.fill();ctx2.restore();}
  } else if(type==='gun'){
    ctx2.fillStyle='#555';
    ctx2.fillRect(12,7,12,5);ctx2.fillRect(20,5,4,9);
  } else if(type==='orb'){
    const og=ctx2.createRadialGradient(22,3,1,22,3,6);og.addColorStop(0,'#fff');og.addColorStop(1,'#9b59b6');
    ctx2.fillStyle=og;ctx2.beginPath();ctx2.arc(22,3,6,0,Math.PI*2);ctx2.fill();
  }
}

// ===================== BUILD CHARACTER SELECT =====================
function buildCharSelect() {
  const grid = document.getElementById('char-select-grid');
  grid.innerHTML = '';
  CHAR_DEFS.forEach((def, i) => {
    const card = document.createElement('div');
    card.className = 'char-card' + (i===0?' selected':'');
    card.onclick = () => {
      document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      selectedChar = i;
    };
    const c = document.createElement('canvas');
    c.width = 44; c.height = 52;
    const cx = c.getContext('2d');
    drawCharSprite(cx, def, 18, 42, 0.9);
    card.appendChild(c);
    const nm = document.createElement('div');
    nm.className = 'char-name';
    nm.textContent = def.name;
    card.appendChild(nm);
    grid.appendChild(card);
  });
}

function confirmChar() {
  const nm = document.getElementById('player-name-input').value.trim();
  playerName = nm || '冒險者';
  myCharDef = CHAR_DEFS[selectedChar];
  document.getElementById('player-display').textContent = playerName;
  document.getElementById('char-overlay').classList.remove('active');
}

// ===================== GAME =====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let score = 0, round = 1, ammoLeft = cfg.ammoPerRound;
let gameOver = false, charging = false, chargeStart = 0;
let power = 0.5, angle = -Math.PI/4;
let projectile = null, trail = [];
let particles = [];

const cannonBase = { x: 72, y: H - 72 };

// Target specs
const TARGET_SPECS = [
  { pts:800, count:3,  r:17 },
  { pts:500, count:6,  r:15 },
  { pts:300, count:12, r:13 },
  { pts:200, count:24, r:10 },
];

const GROUP_CX = 720, GROUP_CY = H - 105, GROUP_R = 125;
let targets = [];

// ---- Maple leaf particles (Canada atmosphere) ----
let leaves = [];
function initLeaves() {
  leaves = [];
  for(let i=0;i<18;i++) {
    leaves.push({
      x: Math.random()*W,
      y: Math.random()*H,
      vx: -0.3-Math.random()*0.4,
      vy: 0.3+Math.random()*0.4,
      rot: Math.random()*Math.PI*2,
      rotV: (Math.random()-0.5)*0.06,
      size: 7+Math.random()*10,
      alpha: 0.4+Math.random()*0.5,
      color: ['#c0392b','#e67e22','#f1c40f','#8B0000'][Math.floor(Math.random()*4)]
    });
  }
}

// Clouds
let clouds = [
  {x:100,y:55,s:1.0},{x:310,y:38,s:0.75},{x:540,y:62,s:1.15},{x:750,y:42,s:0.85}
];

// ---- Init targets ----
function initTargets() {
  targets = [];
  let id=0;
  for(const spec of TARGET_SPECS) {
    for(let i=0;i<spec.count;i++) {
      const a=Math.random()*Math.PI*2, r=Math.random()*(GROUP_R-spec.r-4);
      const spd = cfg.speedMult;
      targets.push({
        id:id++, pts:spec.pts, r:spec.r,
        charIdx: Math.floor(Math.random()*CHAR_DEFS.length),
        ox:r*Math.cos(a), oy:r*Math.sin(a),
        vx:(Math.random()-0.5)*spd,
        vy:(Math.random()-0.5)*spd*0.7,
        hit:false, hitAnim:0,
        walkFrame:0, walkTimer:0, facingRight: Math.random()>0.5,
      });
    }
  }
}

// ---- HUD ----
function renderAmmoBar() {
  const bar=document.getElementById('ammo-bar'); bar.innerHTML='';
  for(let i=0;i<cfg.ammoPerRound;i++){
    const d=document.createElement('div');
    d.className='ammo-dot'+(i>=ammoLeft?' used':'');
    bar.appendChild(d);
  }
}
function updateHUD() {
  document.getElementById('score-display').textContent=score;
  document.getElementById('round-display').textContent=`${round}/${cfg.totalRounds}`;
  const deg = Math.round((-angle)*180/Math.PI);
  document.getElementById('angle-display').textContent=deg+'°';
  const pct=Math.round(power*100);
  document.getElementById('power-display').textContent=pct+'%';
  document.getElementById('power-bar-fill').style.width=pct+'%';
  renderAmmoBar();
}

// ---- Mouse / Touch ----
function updateAngle(mx,my) {
  const dx=mx-cannonBase.x, dy=my-cannonBase.y;
  angle=Math.atan2(dy,dx);
  angle=Math.max(angle,-Math.PI+0.08);
  angle=Math.min(angle,-0.04);
}
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(),sc=W/r.width;
  updateAngle((e.clientX-r.left)*sc,(e.clientY-r.top)*sc);
});
canvas.addEventListener('mousedown',e=>{
  if(e.button!==0||projectile||gameOver||ammoLeft<=0)return;
  charging=true; chargeStart=performance.now();
});
canvas.addEventListener('mouseup',e=>{
  if(e.button!==0||!charging||projectile||ammoLeft<=0)return;
  charging=false; fire();
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect(),sc=W/r.width,t=e.touches[0];
  updateAngle((t.clientX-r.left)*sc,(t.clientY-r.top)*sc);
  if(!projectile&&!gameOver&&ammoLeft>0){charging=true;chargeStart=performance.now();}
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(charging&&!projectile&&ammoLeft>0){charging=false;fire();}
},{passive:false});

function fire() {
  const minSpd=8,maxSpd=24;
  const spd=minSpd+power*(maxSpd-minSpd);
  const tipX=cannonBase.x+Math.cos(angle)*46;
  const tipY=cannonBase.y+Math.sin(angle)*46;
  projectile={x:tipX,y:tipY,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,r:8};
  trail=[];
  ammoLeft--;
  power=0.5;
  updateHUD();
  spawnMuzzle(tipX,tipY);
}

function spawnMuzzle(x,y){
  for(let i=0;i<16;i++){
    const a=angle+(Math.random()-0.5)*1.4, spd=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:0.07+Math.random()*0.05,r:3+Math.random()*4,color:['#ffd700','#ff8c00','#fff','#ffcc44'][~~(Math.random()*4)],grav:.1});
  }
}
function spawnHit(x,y,color){
  for(let i=0;i<22;i++){
    const a=Math.random()*Math.PI*2,spd=1.5+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,life:1,decay:0.04+Math.random()*0.04,r:3+Math.random()*5,color,grav:.2});
  }
}

// ---- Background: Canadian landscape ----
function drawBackground(){
  // Sky
  const sky=ctx.createLinearGradient(0,0,0,H*0.60);
  sky.addColorStop(0,'#1a4fa0'); sky.addColorStop(0.6,'#5b9bd5'); sky.addColorStop(1,'#b0d4f1');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.60);

  // Sun
  ctx.save();
  ctx.fillStyle='rgba(255,230,100,0.22)';
  ctx.beginPath();ctx.arc(820,60,55,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,230,100,0.55)';
  ctx.beginPath();ctx.arc(820,60,34,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFF2A0';
  ctx.beginPath();ctx.arc(820,60,22,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Distant rockies (blue grey)
  const mtnColors=['#9bb0c8','#7d9ab0','#6a8498'];
  [[0,0.28,0.9],[40,0.32,0.85],[0,0.35,0.78]].forEach(([offset,peak,dark],mi)=>{
    ctx.fillStyle=mtnColors[mi];
    ctx.beginPath();ctx.moveTo(0,H*dark);
    const pts=[0,90,170,250,340,430,520,610,700,800,900];
    pts.forEach((x,i)=>{const y=H*(dark-(dark-peak)*Math.abs(Math.sin((x+offset+i*40)*0.012)));ctx.lineTo(x,y);});
    ctx.lineTo(W,H*dark);ctx.closePath();ctx.fill();
    // Snow cap
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath();ctx.moveTo(0,H*(dark-0.06));
    pts.forEach((x,i)=>{const y=H*(dark-(dark-peak)*Math.abs(Math.sin((x+offset+i*40)*0.012)));if(y<H*(dark-0.04))ctx.lineTo(x,y);});
    ctx.closePath();ctx.fill();
  });

  // Clouds
  clouds.forEach(c=>drawCloud(c.x,c.y,c.s));

  // Pine forest silhouette (left bank)
  ctx.fillStyle='#1a5c2a';
  for(let x=0;x<W*0.48;x+=22){
    const h=35+Math.sin(x*0.07)*10+(x%3)*5;
    const bx=x; const by=H*0.60;
    ctx.beginPath();
    ctx.moveTo(bx,by);ctx.lineTo(bx+11,by-h);ctx.lineTo(bx+22,by);
    ctx.closePath();ctx.fill();
  }
  // Pine forest silhouette (right bank)
  ctx.fillStyle='#1a5c2a';
  for(let x=W*0.57;x<W;x+=22){
    const h=30+Math.cos(x*0.09)*8+(x%3)*4;
    ctx.beginPath();ctx.moveTo(x,H*0.57);ctx.lineTo(x+11,H*0.57-h);ctx.lineTo(x+22,H*0.57);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#145220';
  for(let x=0;x<W*0.48;x+=18){
    const h=20+Math.sin(x*0.11)*6;
    ctx.beginPath();ctx.moveTo(x,H*0.60);ctx.lineTo(x+9,H*0.60-h);ctx.lineTo(x+18,H*0.60);ctx.closePath();ctx.fill();
  }
  for(let x=W*0.57;x<W;x+=18){
    const h=18+Math.cos(x*0.13)*5;
    ctx.beginPath();ctx.moveTo(x,H*0.57);ctx.lineTo(x+9,H*0.57-h);ctx.lineTo(x+18,H*0.57);ctx.closePath();ctx.fill();
  }

  // Ground (left - player side)
  const gL=ctx.createLinearGradient(0,H*0.60,0,H);
  gL.addColorStop(0,'#3a6b2a');gL.addColorStop(0.12,'#2d5220');gL.addColorStop(0.3,'#4a3010');gL.addColorStop(1,'#2a1a08');
  ctx.fillStyle=gL;ctx.fillRect(0,H*0.60,W*0.46,H);

  // River (frozen/blue-green)
  const rv=ctx.createLinearGradient(W*0.46,0,W*0.56,0);
  rv.addColorStop(0,'#1a5fa0');rv.addColorStop(0.5,'#2980b9');rv.addColorStop(1,'#1a5fa0');
  ctx.fillStyle=rv;ctx.fillRect(W*0.46,H*0.58,W*0.11,H);
  // River shimmer
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  for(let y=H*0.60;y<H;y+=18){
    ctx.beginPath();ctx.moveTo(W*0.46,y);
    for(let x=W*0.46;x<W*0.57;x+=8){ctx.lineTo(x,y+Math.sin((x+y)*0.2)*2);}
    ctx.stroke();
  }

  // Ground (right - enemy side)
  const gR=ctx.createLinearGradient(0,H*0.57,0,H);
  gR.addColorStop(0,'#3a6b2a');gR.addColorStop(0.12,'#2d5220');gR.addColorStop(0.3,'#4a3010');gR.addColorStop(1,'#2a1a08');
  ctx.fillStyle=gR;ctx.fillRect(W*0.57,H*0.57,W*0.43,H);

  // Grass top edges
  ctx.fillStyle='#3a8c40';
  ctx.fillRect(0,H*0.60,W*0.46,10);
  ctx.fillRect(W*0.57,H*0.57,W*0.43,10);

  // Maple leaves falling
  leaves.forEach(lf=>drawLeaf(lf));
}

function drawLeaf(lf){
  ctx.save();
  ctx.globalAlpha=lf.alpha;
  ctx.translate(lf.x,lf.y);
  ctx.rotate(lf.rot);
  ctx.fillStyle=lf.color;
  ctx.beginPath();
  const s=lf.size/14;
  ctx.scale(s,s);
  // Simple maple leaf shape
  ctx.moveTo(0,14);
  ctx.lineTo(-3,8);ctx.lineTo(-8,10);ctx.lineTo(-5,4);
  ctx.lineTo(-12,2);ctx.lineTo(-7,-2);ctx.lineTo(-10,-7);
  ctx.lineTo(-4,-5);ctx.lineTo(-2,-11);ctx.lineTo(0,-6);
  ctx.lineTo(2,-11);ctx.lineTo(4,-5);ctx.lineTo(10,-7);
  ctx.lineTo(7,-2);ctx.lineTo(12,2);ctx.lineTo(5,4);
  ctx.lineTo(8,10);ctx.lineTo(3,8);ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCloud(cx,cy,s){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  ctx.fillStyle='rgba(255,255,255,0.80)';
  [{x:0,y:0,r:26},{x:20,y:-7,r:20},{x:-20,y:-5,r:18},{x:36,y:4,r:16},{x:-36,y:4,r:15}].forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}

// ---- Cannon ----
function drawCannon(){
  const {x,y}=cannonBase;
  ctx.save();
  // Wheels
  [[x-14,y+18],[x+14,y+18]].forEach(([wx,wy])=>{
    ctx.fillStyle='#5a3e1b';ctx.strokeStyle='#2a1e0b';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(wx,wy,15,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#8b6343';ctx.lineWidth=2;
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(a)*12,wy+Math.sin(a)*12);ctx.stroke();}
  });
  // Body
  ctx.fillStyle='#8b6343';ctx.strokeStyle='#5a3e1b';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x,y+6,26,12,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Barrel
  ctx.translate(x,y);ctx.rotate(angle);
  const bg=ctx.createLinearGradient(0,-9,0,9);
  bg.addColorStop(0,'#ccc');bg.addColorStop(0.5,'#888');bg.addColorStop(1,'#555');
  ctx.fillStyle=bg;ctx.strokeStyle='#333';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(4,-8,42,16,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#bbb';ctx.beginPath();ctx.ellipse(46,0,5,8,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
  // Charge glow
  if(charging){
    const elapsed=(performance.now()-chargeStart)/1000;
    power=Math.min(elapsed/2.0,1.0);
    const glow=Math.sin(elapsed*8)*0.3+0.7;
    ctx.save();ctx.globalAlpha=power*glow*0.55;
    const cg=ctx.createRadialGradient(x,y,0,x,y,40*power);
    cg.addColorStop(0,'#ffd700');cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x,y,40*power,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ---- Targets (as MapleStory characters) ----
function updateTargets(dt){
  const spd=cfg.speedMult;
  targets.forEach(t=>{
    if(t.hit){t.hitAnim+=dt*3;return;}
    t.ox+=t.vx;t.oy+=t.vy;
    const dist=Math.sqrt(t.ox*t.ox+t.oy*t.oy);
    const maxR=GROUP_R-t.r;
    if(dist>maxR){const nx=t.ox/dist,ny=t.oy/dist;t.vx-=nx*0.5;t.vy-=ny*0.3;}
    t.vx+=(Math.random()-0.5)*spd*0.06;
    t.vy+=(Math.random()-0.5)*spd*0.05;
    const maxV=spd*1.2;
    t.vx=Math.max(-maxV,Math.min(maxV,t.vx));
    t.vy=Math.max(-maxV*0.7,Math.min(maxV*0.7,t.vy));
    t.vx*=0.985;t.vy*=0.985;
    // Walking animation
    t.walkTimer+=dt;
    if(t.walkTimer>0.18){t.walkTimer=0;t.walkFrame=(t.walkFrame+1)%4;}
    if(Math.abs(t.vx)>0.05) t.facingRight=t.vx>0;
  });
}

// Point color per score tier
function tierColor(pts){ return pts===800?'#e74c3c':pts===500?'#e67e22':pts===300?'#27ae60':'#2980b9'; }

function drawTargets(){
  // Aura behind group
  ctx.save();ctx.globalAlpha=0.10;
  ctx.fillStyle='#e74c3c';
  ctx.beginPath();ctx.arc(GROUP_CX,GROUP_CY,GROUP_R+18,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Draw by pts ascending so high-value on top
  const sorted=[...targets].sort((a,b)=>a.pts-b.pts);
  sorted.forEach(t=>{
    if(t.hit&&t.hitAnim>1)return;
    const tx=GROUP_CX+t.ox, ty=GROUP_CY+t.oy;
    const def=CHAR_DEFS[t.charIdx];
    ctx.save();
    if(t.hit){ctx.globalAlpha=1-t.hitAnim;ctx.translate(tx,ty);ctx.scale(1+t.hitAnim,1+t.hitAnim);ctx.translate(-tx,-ty);}
    // Walking bob
    const bobY=Math.sin(t.walkFrame*Math.PI/2)*2;
    const sc=t.r/17;
    ctx.translate(tx, ty+bobY);
    drawCharSprite(ctx, def, 0, 0, sc*0.85, !t.facingRight);
    // Score badge
    ctx.fillStyle=tierColor(t.pts);
    ctx.beginPath();ctx.ellipse(0,-t.r*1.5,t.r*0.85,t.r*0.55,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(7,t.r*0.6)}px Noto Sans TC`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=2;
    ctx.fillText(t.pts,0,-t.r*1.5);
    ctx.restore();
  });
}

// ---- Projectile ----
function updateProjectile(dt){
  if(!projectile)return;
  trail.push({x:projectile.x,y:projectile.y});
  if(trail.length>24)trail.shift();
  projectile.vy+=9.8*dt;
  projectile.x+=projectile.vx;
  projectile.y+=projectile.vy;
  for(const t of targets){
    if(t.hit)continue;
    const tx=GROUP_CX+t.ox,ty=GROUP_CY+t.oy;
    const dx=projectile.x-tx,dy=projectile.y-ty;
    if(Math.sqrt(dx*dx+dy*dy)<t.r+projectile.r){
      t.hit=true;
      score+=t.pts;
      spawnHit(tx,ty,tierColor(t.pts));
      showHitPopup(tx,ty,t.pts,t.charIdx);
      updateHUD();
      projectile=null;trail=[];
      checkRoundEnd();
      return;
    }
  }
  if(projectile.x>W+20||projectile.x<-20||projectile.y>H+20){
    projectile=null;trail=[];
    checkRoundEnd();
  }
}

function drawProjectile(){
  for(let i=0;i<trail.length;i++){
    const a=(i/trail.length)*0.55,r=4*(i/trail.length);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ffd700';
    ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  if(!projectile)return;
  const pg=ctx.createRadialGradient(projectile.x-2,projectile.y-2,1,projectile.x,projectile.y,projectile.r);
  pg.addColorStop(0,'#fff');pg.addColorStop(0.4,'#ffd700');pg.addColorStop(1,'#c8860a');
  ctx.fillStyle=pg;ctx.strokeStyle='#8b6000';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(projectile.x,projectile.y,projectile.r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle='#ffd700';
  ctx.beginPath();ctx.arc(projectile.x,projectile.y,projectile.r*2.2,0,Math.PI*2);ctx.fill();ctx.restore();
}

// ---- Aim line ----
function drawAimLine(){
  if(projectile||gameOver||ammoLeft<=0)return;
  const spd=8+power*16;
  let ax=cannonBase.x+Math.cos(angle)*48,ay=cannonBase.y+Math.sin(angle)*48;
  let vx=Math.cos(angle)*spd,vy=Math.sin(angle)*spd;
  ctx.save();ctx.setLineDash([4,9]);ctx.strokeStyle='rgba(255,220,80,0.38)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ax,ay);
  for(let i=0;i<35;i++){vy+=9.8*0.05;ax+=vx;ay+=vy;if(ax>W||ay>H)break;ctx.lineTo(ax,ay);}
  ctx.stroke();ctx.restore();
}

// ---- Particles ----
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;
    p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}

// ---- Hit popup ----
let hitPopupPending=false;
function closeHitPopup(){
  document.getElementById('hit-popup').style.display='none';
  hitPopupPending=false;
  // Resume round-end check after player confirms
  checkRoundEnd();
}
function showHitPopup(wx,wy,pts,charIdx){
  hitPopupPending=true;
  const popup=document.getElementById('hit-popup');
  document.getElementById('hit-score-val').textContent='+'+pts;
  // Draw character in popup canvas
  const pc=document.getElementById('hit-char-canvas');
  const pcx=pc.getContext('2d');
  pcx.clearRect(0,0,pc.width,pc.height);
  drawCharSprite(pcx, CHAR_DEFS[charIdx], pc.width/2, pc.height-8, 1.3);
  // Position popup near hit point, centred if near edge
  const gw=document.getElementById('game-wrap');
  const rect=canvas.getBoundingClientRect();
  const wRect=gw.getBoundingClientRect();
  const sc=rect.width/W;
  let px=(wx*sc)+(rect.left-wRect.left)-85;
  let py=(wy*sc)+(rect.top-wRect.top)-110;
  px=Math.max(6,Math.min(px,rect.width-190));
  py=Math.max(6,Math.min(py,rect.height-130));
  popup.style.left=px+'px';
  popup.style.top=py+'px';
  popup.style.display='block';
  popup.style.animation='none';
  void popup.offsetWidth;
  popup.style.animation='popIn .3s ease-out';
}

// ---- Round / End ----
function checkRoundEnd(){
  if(projectile)return;
  if(hitPopupPending)return; // wait for player to confirm hit popup
  const allHit=targets.every(t=>t.hit);
  if(allHit||ammoLeft<=0){
    setTimeout(()=>{
      if(round<cfg.totalRounds){
        round++;ammoLeft=cfg.ammoPerRound;
        initTargets();updateHUD();
      } else { endGame(); }
    },1400);
  }
}
function endGame(){
  gameOver=true;
  document.getElementById('end-score').textContent=score+' 分';
  document.getElementById('end-overlay').classList.add('active');
}
function restartGame(){
  score=0;round=1;ammoLeft=cfg.ammoPerRound;
  gameOver=false;projectile=null;trail=[];particles=[];power=0.5;
  initTargets();updateHUD();
  document.getElementById('end-overlay').classList.remove('active');
}

// ---- Score float ----
function addScorePopup(x,y,pts,color){
  const wrap=document.getElementById('game-wrap');
  const rect=canvas.getBoundingClientRect();const wrapRect=wrap.getBoundingClientRect();
  const sc=rect.width/W;
  const el=document.createElement('div');el.className='score-popup';
  el.style.left=((x*sc)+(rect.left-wrapRect.left)-16)+'px';
  el.style.top=((y*sc)+(rect.top-wrapRect.top)-16)+'px';
  el.style.color=color;el.textContent='+'+pts;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

// ---- Main loop ----
let lastTime=0;
function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;
  ctx.clearRect(0,0,W,H);
  // Cloud drift
  clouds.forEach(c=>{c.x+=0.12*c.s;if(c.x>W+90)c.x=-90;});
  // Leaf update
  leaves.forEach(lf=>{
    lf.x+=lf.vx;lf.y+=lf.vy;lf.rot+=lf.rotV;
    if(lf.y>H+20){lf.y=-20;lf.x=Math.random()*W;}
    if(lf.x<-20){lf.x=W+20;}
  });
  drawBackground();
  drawAimLine();
  updateTargets(dt);
  drawTargets();
  drawCannon();
  updateProjectile(dt);
  drawProjectile();
  updateParticles(dt);
  drawParticles();
  if(charging){
    const el=(performance.now()-chargeStart)/1000;
    power=Math.min(el/2.0,1.0);updateHUD();
  }
  requestAnimationFrame(gameLoop);
}

// ---- Init ----
buildCharSelect();
initTargets();
initLeaves();
updateHUD();
requestAnimationFrame(ts=>{lastTime=ts;gameLoop(ts);});
</script>
